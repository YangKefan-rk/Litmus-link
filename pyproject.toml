[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litmus-link"
version = "0.1.0"
description = "RISC-V litmus generator for RVWMO, Vector, CMO, PBMT/NC, and TLB cross scenarios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Litmus-link contributors" }]
dependencies = ["Pillow>=9.0"]

[project.scripts]
litmus-link = "litmus_link.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["litmus_link*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
